name: Test

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  test:
    name: Test
    # TODO: Waiting for Swift to update the tooling for ubuntu 24
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        language:
          - java
          - python
          - typescript
          - typescript-mjs
          - go
          - ruby
          - csharp
          - php
          - swift
          - dart
          - rust
        php-version:
          - '7.4'
          - '8.2'
        exclude:
          - php-version: '8.2'
        include:
          - language: php
            php-version: '7.4'
          - language: php
            php-version: '8.2'
    steps:
      - name: Common - Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'
      # Language specific setup

      # Java setup
      - name: Java - Set up JDK
        if: matrix.language == 'java'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "8"
          distribution: "temurin"
      - name: Java - Install jbang
        if: matrix.language == 'java'
        uses: jbangdev/setup-jbang@2b1b465a7b75f4222b81426f23a01e013aa7b95c # v0.1.1

      # Python setup
      - name: Python - Install Poetry
        if: matrix.language == 'python'
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
      - name: Python - Add Poetry to PATH
        if: matrix.language == 'python'
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Typescript setup
      - name: Typescript - Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.language == 'typescript'
        with:
          node-version: 22

      # Typescript mjs setup
      - name: Typescript mjs - Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.language == 'typescript-mjs'
        with:
          node-version: 22

      # Go setup
      - name: Go - Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version: '1.20'

      # C# setup
      - name: C# - Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.language == 'csharp'
        with:
          dotnet-version: 9

      # Ruby setup
      - name: Ruby - Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        if: matrix.language == 'ruby'
        with:
          ruby-version: '3.0'

      # PHP setup
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        if: matrix.language == 'php'
        with:
          php-version: ${{ matrix.php-version }}

      # Swift setup
      # WORKAROUND for: https://github.com/swift-actions/setup-swift/issues/591
      # - uses: swift-actions/setup-swift@v2
      - uses: redsun82/setup-swift@b2b6f77ab14f6a9b136b520dc53ec8eca27d2b99
        if: matrix.language == 'swift'
        with:
          swift-version: "5.8"

      # Dart setup
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        if: matrix.language == 'dart'
        with:
          sdk: "stable"

      # Rust setup
      - name: Rust - Setup Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      # Common testing
      - name: Common - Run Tests for ${{ matrix.language }}
        run: ./tests/test.sh ${{ matrix.language }}
